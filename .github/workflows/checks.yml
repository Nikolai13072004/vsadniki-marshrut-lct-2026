name: Application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q && python -m ruff check backend scripts && python -m ruff format --check backend scripts && python scripts/verify_sources.py
      - run: npm ci && npm run typecheck && npm run format:check && npm run test:metrics && npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - run: docker compose up --build -d --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/beeline-business.png --output /dev/null
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report
