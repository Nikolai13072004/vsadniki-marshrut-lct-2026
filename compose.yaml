services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PATH: /state/routing.sqlite
      OSRM_URL: https://router.project-osrm.org
    volumes:
      - routing-state:/state
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  routing-state:
